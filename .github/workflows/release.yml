name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version used in package filenames (for example 1.5.0-test)"
        required: true
        default: "0.0.0-test"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve package version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".TrimStart('v')
          }
          else {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Package version is empty"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller tzdata

      - name: Run tests
        run: python -m pytest

      - name: Build portable application
        run: python build_release.py --reset-settings

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          Compress-Archive `
            -Path "dist\PC Remote" `
            -DestinationPath "release\PC-Remote-$env:APP_VERSION-windows-x64-portable.zip" `
            -Force

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }

          & $iscc "/DAppVersion=$env:APP_VERSION" "installer\PC-Remote.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify unattended install and ARP metadata
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter '*-Setup.exe' | Select-Object -First 1
          if (-not $setup) {
            throw 'Setup EXE was not produced.'
          }

          $install = Start-Process `
            -FilePath $setup.FullName `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Silent installer failed with exit code $($install.ExitCode)"
          }

          $installedExe = Join-Path $env:LOCALAPPDATA 'Programs\PC Remote\PC Remote.exe'
          if (-not (Test-Path $installedExe)) {
            throw "Installed executable not found: $installedExe"
          }

          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8A5675B9-1F20-4E2B-8BB4-D0C42973F9E4}_is1'
          $arp = Get-ItemProperty $uninstallKey -ErrorAction Stop
          if ($arp.DisplayName -ne "PC Remote $env:APP_VERSION") {
            throw "Unexpected ARP DisplayName: $($arp.DisplayName)"
          }
          if ($arp.DisplayVersion -ne $env:APP_VERSION) {
            throw "Unexpected ARP DisplayVersion: $($arp.DisplayVersion)"
          }
          if ($arp.Publisher -ne 'mimaxon1') {
            throw "Unexpected ARP Publisher: $($arp.Publisher)"
          }

          $uninstaller = Join-Path $env:LOCALAPPDATA 'Programs\PC Remote\unins000.exe'
          if (-not (Test-Path $uninstaller)) {
            throw "Uninstaller not found: $uninstaller"
          }
          $uninstall = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' `
            -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Silent uninstaller failed with exit code $($uninstall.ExitCode)"
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem release -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $lines | Set-Content -Path "release\SHA256SUMS.txt" -Encoding ascii
          Get-Content "release\SHA256SUMS.txt"

      - name: Generate WinGet, Chocolatey and Scoop metadata
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter '*-Setup.exe' | Select-Object -First 1
          $portable = Get-ChildItem release -Filter '*-portable.zip' | Select-Object -First 1
          if (-not $setup -or -not $portable) {
            throw 'Release artifacts required for distribution metadata are missing.'
          }

          $setupSha = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          $portableSha = (Get-FileHash $portable.FullName -Algorithm SHA256).Hash

          python scripts/render_distribution.py `
            --version $env:APP_VERSION `
            --setup-sha256 $setupSha `
            --portable-sha256 $portableSha `
            --output release/distribution

          $wingetDir = "release\distribution\winget\manifests\m\mimaxon1\PCRemote\$env:APP_VERSION"
          if (-not (Test-Path $wingetDir)) {
            throw 'WinGet manifest set was not generated.'
          }

          Get-Content "release\distribution\scoop\pc-remote.json" -Raw | ConvertFrom-Json | Out-Null

          choco pack "release\distribution\chocolatey\pc-remote.nuspec" `
            --outputdirectory "release\distribution\chocolatey"
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey package build failed with exit code $LASTEXITCODE"
          }

      - name: Upload build and distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pc-remote-${{ env.APP_VERSION }}
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
            release/distribution/**
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PC Remote ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
