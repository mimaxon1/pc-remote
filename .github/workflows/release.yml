name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version used in package filenames (for example 1.5.0-test)"
        required: true
        default: "dev"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve package version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".TrimStart('v')
          }
          else {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Package version is empty"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller tzdata

      - name: Run tests
        run: python -m pytest

      - name: Build portable application
        run: python build_release.py --reset-settings

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          Compress-Archive `
            -Path "dist\PC Remote" `
            -DestinationPath "release\PC-Remote-$env:APP_VERSION-windows-x64-portable.zip" `
            -Force

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }

          & $iscc "/DAppVersion=$env:APP_VERSION" "installer\PC-Remote.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem release -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $lines | Set-Content -Path "release\SHA256SUMS.txt" -Encoding ascii
          Get-Content "release\SHA256SUMS.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-remote-${{ env.APP_VERSION }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PC Remote ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
