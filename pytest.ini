[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

# Ignore certain directories during test discovery
norecursedirs = .git .venv build dist web _internal __pycache__ .pytest_cache .test-auth-work tmp*

# Markers for test organization
markers =
    auth: Authentication and token tests
    audio: Audio control tests
    api: API endpoint tests
    slow: Tests that take a long time
